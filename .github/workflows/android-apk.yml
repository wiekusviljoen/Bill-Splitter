name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build APK
        run: dotnet publish BillSplitterApp/BillSplitterApp.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk --no-restore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BillSplitter-Android
          path: BillSplitterApp/bin/Release/net10.0-android/publish/*.apk
