<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="Snap a receipt and split the bill.">
<title>Bill Splitter</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body><main class="app">
<header class="hero"><div class="brand">Bill Splitter</div><p>Snap a receipt. Split the bill. Done.</p></header>
<section class="card"><label class="upload"><input id="receiptInput" type="file" accept="image/*" capture="environment"><span class="upload-icon">📸</span><strong>Take a photo of your bill</strong><small>We'll read the total from your receipt.</small></label><div id="receiptStatus" class="status" aria-live="polite"></div></section>
<section class="card"><div class="grid">
<label>Bill total<div class="money-input"><span>N$</span><input id="billTotal" inputmode="decimal" type="number" min="0" step="0.01" value="0"></div></label>
<label>People<input id="people" type="number" min="1" max="100" value="2"></label>
</div>
<label>Tip<div class="tip-row"><button type="button" data-tip="0">0%</button><button type="button" data-tip="10">10%</button><button type="button" data-tip="15" class="selected">15%</button><button type="button" data-tip="20">20%</button><input id="tip" type="number" min="0" max="100" step="1" value="15" aria-label="Tip percentage"></div></label></section>
<section class="total-card" aria-live="polite"><span>Each person pays</span><strong id="each">N$0.00</strong><div class="breakdown"><div><small>Bill</small><b id="billOut">N$0.00</b></div><div><small>Tip</small><b id="tipOut">N$0.00</b></div><div><small>Total</small><b id="grandOut">N$0.00</b></div></div></section>
<button id="reset" class="secondary" type="button">Reset</button>
</main><script src="app.js"></script></body></html>
